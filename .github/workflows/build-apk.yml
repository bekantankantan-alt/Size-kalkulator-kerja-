name: Build SIZE KERJA APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and extract project ZIP
        id: project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP project tidak ditemukan di folder utama repository."
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE="$(find extracted -type f -name 'settings.gradle.kts' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle.kts tidak ditemukan dalam ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Fix settings and enable AndroidX
        shell: bash
        run: |
          set -e
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          cat > "$PROJECT_DIR/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "KalkulatorSIZE"
          include(":app")
          EOF

          PROPERTIES_FILE="$PROJECT_DIR/gradle.properties"
          touch "$PROPERTIES_FILE"

          if ! grep -q '^android.useAndroidX=true$' "$PROPERTIES_FILE"; then
            echo 'android.useAndroidX=true' >> "$PROPERTIES_FILE"
          fi

      - name: Create JVM target fix
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/jvm-fix.gradle" <<'EOF'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.configureEach {
                  if (name.startsWith("compile") && name.endsWith("Kotlin")) {
                      if (hasProperty("kotlinOptions")) {
                          kotlinOptions.jvmTarget = "17"
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle -I "$GITHUB_WORKSPACE/jvm-fix.gradle" assembleDebug -Pandroid.useAndroidX=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIZE-KERJA-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
