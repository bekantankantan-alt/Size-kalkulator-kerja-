name: Build SIZE KERJA APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source dari GitHub
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cari dan ekstrak ZIP project
        id: project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP project tidak ditemukan di folder utama repository."
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE="$(find extracted -type f -name 'settings.gradle.kts' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle.kts tidak ditemukan di dalam ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle assembleDebug

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIZE-KERJA-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
